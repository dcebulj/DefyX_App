<!-- invitar.html - Formulario de invitación a desafío -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitar a un desafío | DefyX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Invita a alguien a este desafío</h1>
  </header>

  <main>
    <form class="formulario-invitacion">
      <label for="nombre">Nombre del destinatario:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo electrónico o usuario:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="mensaje">Mensaje personal (opcional):</label>
      <textarea id="mensaje" name="mensaje" rows="3"></textarea>

      <label for="oferta">¿Cuánto estarías dispuesto a pagar para que acepte el desafío?</label>
      <input type="number" id="oferta" name="oferta" placeholder="$0" min="0">

      <button type="submit">Enviar invitación</button>
    </form>
  </main>

  <footer>
    <p><a href="detalle.html">⬅ Volver al desafío</a></p>
  </footer>
</body>
</html>
