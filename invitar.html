<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitar a un desafío | DefyX</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #18191a;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      padding: 2rem 1rem 1rem 1rem;
      text-align: center;
      background: linear-gradient(180deg, #2196f3 60%, #18191a 100%);
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
      color: #fff;
      letter-spacing: 1px;
    }
    main {
      max-width: 420px;
      margin: 2rem auto 5rem auto;
      background: #23272a;
      border-radius: 1.1rem;
      box-shadow: 0 2px 8px #0002;
      padding: 2rem 1.5rem;
    }
    .formulario-invitacion label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      color: #b0b0b0;
    }
    .formulario-invitacion input[type="text"],
    .formulario-invitacion input[type="email"],
    .formulario-invitacion input[type="number"],
    .formulario-invitacion textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      border: none;
      margin-bottom: 1rem;
      font-size: 1rem;
      background: #18191a;
      color: #fff;
      resize: none;
    }
    .formulario-invitacion button[type="submit"] {
      background: #1da1f2;
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      margin-top: 0.5rem;
    }
    .formulario-invitacion button[type="submit"]:hover {
      background: #2196f3;
    }
    .mensaje-exito {
      background: #1da1f2;
      color: #fff;
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
      margin: 1.5rem 0 0 0;
      font-size: 1.1rem;
      display: none;
    }
    footer {
      text-align: center;
      margin: 2rem 0 5.5rem 0;
    }
    footer a {
      color: #4fc3f7;
      text-decoration: underline;
      font-size: 1rem;
    }
    .main-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #23272a;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 56px;
      z-index: 10;
    }
    .main-nav a {
      color: #b0b0b0;
      font-size: 1.7rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.2rem 0;
      flex: 1;
      transition: color 0.2s;
      font-weight: 600;
    }
    .main-nav a.active,
    .main-nav a:hover {
      color: #1da1f2;
    }
    .main-nav a span:last-child {
      font-size: 0.85rem;
      margin-top: 0.1rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Invita a alguien a este desafío</h1>
  </header>

  <main>
    <form class="formulario-invitacion" id="formInvitacion">
      <label for="nombre">Nombre del destinatario:</label>
      <input type="text" id="nombre" name="nombre" required>

      <label for="correo">Correo electrónico o usuario:</label>
      <input type="email" id="correo" name="correo" required>

      <label for="mensaje">Mensaje personal (opcional):</label>
      <textarea id="mensaje" name="mensaje" rows="3"></textarea>

      <label for="oferta">¿Cuánto estarías dispuesto a pagar para que acepte el desafío?</label>
      <input type="number" id="oferta" name="oferta" placeholder="$0" min="0">

      <button type="submit">Enviar invitación</button>
    </form>
    <div class="mensaje-exito" id="mensajeExito">
      ¡Invitación enviada con éxito!
    </div>
  </main>

  <footer>
    <p><a href="detalle.html">⬅ Volver al desafío</a></p>
  </footer>

  <nav class="main-nav">
    <a href="index.html" title="Inicio"><span>🏠</span><span>Inicio</span></a>
    <a href="explorar.html" title="Explorar"><span>🔥</span><span>Explorar</span></a>
    <a href="mis-desafios.html" title="Mis desafíos"><span>🎯</span><span>Mis desafíos</span></a>
    <a href="notificaciones.html" title="Notificaciones"><span>🔔</span><span>Notificaciones</span></a>
    <a href="perfil.html" title="Perfil"><span>👤</span><span>Perfil</span></a>
  </nav>

  <script>
    document.getElementById('formInvitacion').onsubmit = function(e) {
      e.preventDefault();
      document.getElementById('mensajeExito').style.display = 'block';
      this.reset();
      setTimeout(() => {
        document.getElementById('mensajeExito').style.display = 'none';
      }, 3500);
    };
  </script>
</body>
