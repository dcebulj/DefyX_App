<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subir Evidencia / Crear Desafío - DefyX</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #18191a;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .subir-header {
      padding: 1.5rem 1.2rem 0.5rem 1.2rem;
      font-size: 2rem;
      font-weight: bold;
      color: #1da1f2;
      letter-spacing: 1px;
    }
    .subir-card {
      background: #23272a;
      border-radius: 1.1rem;
      box-shadow: 0 2px 8px #0002;
      overflow: hidden;
      margin: 2rem auto 1.5rem auto;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
    }
    .subir-form label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #b0b0b0;
    }
    .subir-form input[type="text"],
    .subir-form textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 1rem;
      border: none;
      margin-bottom: 1rem;
      font-size: 1rem;
      background: #18191a;
      color: #fff;
      resize: none;
    }
    .subir-form input[type="file"] {
      margin-bottom: 1rem;
      color: #fff;
    }
    .btn-accion {
      background: #1da1f2;
      color: #fff;
      border: none;
      border-radius: 2rem;
      padding: 0.7rem 1.5rem;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-right: 0.5rem;
    }
    .btn-accion:hover {
      background: #2196f3;
    }
    .mensaje-exito {
      background: #1da1f2;
      color: #fff;
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
      margin: 1.5rem 0 0 0;
      font-size: 1.1rem;
      display: none;
    }
    .main-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      background: #23272a;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      height: 56px;
      z-index: 10;
    }
    .main-nav a {
      color: #b0b0b0;
      font-size: 1.7rem;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.2rem 0;
      flex: 1;
      transition: color 0.2s;
      font-weight: 600;
    }
    .main-nav a.active,
    .main-nav a:hover {
      color: #1da1f2;
    }
    .main-nav a span:last-child {
      font-size: 0.85rem;
      margin-top: 0.1rem;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="subir-header">Subir evidencia</div>
  <div class="subir-card">
    <form class="subir-form" id="formEvidencia">
      <label for="evidencia">Imagen o video de tu desafío</label>
      <input type="file" id="evidencia" name="evidencia" accept="image/*,video/*" required>
      <label for="comentario">Comentario (opcional)</label>
      <textarea id="comentario" name="comentario" rows="3" placeholder="Agrega un comentario..."></textarea>
      <button type="submit" class="btn-accion">Subir evidencia</button>
    </form>
    <div class="mensaje-exito" id="mensajeExito">
      ¡Evidencia subida con éxito! Tu desafío será revisado y pronto recibirás tu recompensa.
    </div>
  </div>

  <div class="subir-header" style="margin-top:2.5rem;">Crear nuevo desafío</div>
  <div class="subir-card">
    <form class="subir-form" id="formDesafio">
      <label for="titulo">Título del desafío</label>
      <input type="text" id="titulo" name="titulo" maxlength="60" required>
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="descripcion" rows="3" maxlength="200" required></textarea>
      <label for="tipo">Tipo de desafío</label>
      <select id="tipo" name="tipo" required style="width:100%;padding:0.7rem 1rem;border-radius:1rem;border:none;margin-bottom:1rem;font-size:1rem;background:#18191a;color:#fff;">
        <option value="">Selecciona tipo</option>
        <option value="gratis">🙌 Gratis</option>
        <option value="regalo">🎁 Regalo</option>
        <option value="pago">💸 Pago</option>
      </select>
      <label for="media">Imagen o video (opcional)</label>
      <input type="file" id="media" name="media" accept="image/*,video/*">
      <button type="submit" class="btn-accion">Crear desafío</button>
    </form>
    <div class="mensaje-exito" id="mensajeDesafio">
      ¡Desafío creado con éxito! Ahora aparecerá en el feed de exploración.
    </div>
  </div>

  <nav class="main-nav">
    <a href="index.html" title="Inicio"><span>🏠</span><span>Inicio</span></a>
    <a href="explorar.html" title="Explorar"><span>🔥</span><span>Explorar</span></a>
    <a href="mis-desafios.html" title="Mis desafíos"><span>🎯</span><span>Mis desafíos</span></a>
    <a href="notificaciones.html" title="Notificaciones"><span>🔔</span><span>Notificaciones</span></a>
    <a href="perfil.html" title="Perfil"><span>👤</span><span>Perfil</span></a>
  </nav>

  <script>
    // Subir evidencia
    document.getElementById('formEvidencia').onsubmit = function(e) {
      e.preventDefault();
      document.getElementById('mensajeExito').style.display = 'block';
      this.reset();
      setTimeout(() => {
        document.getElementById('mensajeExito').style.display = 'none';
      }, 3500);
    };

    // Crear desafío
    document.getElementById('formDesafio').onsubmit = function(e) {
      e.preventDefault();
      document.getElementById('mensajeDesafio').style.display = 'block';
      this.reset();
      setTimeout(() => {
        document.getElementById('mensajeDesafio').style.display = 'none';
      }, 3500);
    };
  </script>
</body>
</html>
